
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#D1FAE5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Panda-Mate Android</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      // Initialize PDF.js worker
      if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap');
      
      :root {
        --m3-surface: rgba(255, 255, 255, 0.6);
        --m3-on-surface: #1C1B1F;
        --m3-primary: #10B981;
        --m3-secondary-container: #FEF9C3;
        --m3-on-secondary-container: #422006;
      }

      body {
        font-family: 'Roboto', sans-serif;
        /* The requested light green to light yellow gradient */
        background: linear-gradient(135deg, #D1FAE5 0%, #FEF3C7 100%);
        background-attachment: fixed;
        color: var(--m3-on-surface);
        margin: 0;
        padding: 0;
        overflow: hidden;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* M3 Elevation / Shadows - Glassmorphism style */
      .m3-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 28px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.4);
      }

      @keyframes ripple {
        from { transform: scale(0); opacity: 0.4; }
        to { transform: scale(4); opacity: 0; }
      }
      .ripple-container { position: relative; overflow: hidden; }
      
      /* Smooth tab transitions */
      .tab-content {
        animation: slide-up 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        height: 100%;
        width: 100%;
      }
      @keyframes slide-up {
        from { transform: translateY(30px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      @keyframes xp-float {
        0% { transform: translate(-50%, -50%) translateY(0); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translate(-50%, -50%) translateY(-100px); opacity: 0; }
      }
      .animate-xp-float {
        animation: xp-float 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      #root {
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }

      /* Fix for Recharts on mobile */
      .recharts-responsive-container {
        min-width: 0 !important;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",

    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",

    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3",
    "vite": "https://esm.sh/vite@^7.3.1"
  }
}
</script>
  </head>

    <div id="root"></div>

  </body>
</html>
