
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F0FDF4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Panda-Mate Android</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap');
      
      :root {
        --m3-surface: transparent;
        --m3-on-surface: #1C1B1F;
        --m3-primary: #4F46E5;
        --m3-secondary-container: #E8DEF8;
        --m3-on-secondary-container: #1D192B;
      }

      body {
        font-family: 'Roboto', sans-serif;
        background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        background-attachment: fixed;
        color: var(--m3-on-surface);
        margin: 0;
        overflow: hidden;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* M3 Elevation / Shadows */
      .m3-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(12px);
        border-radius: 32px;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      /* M3 Navigation Pill */
      .nav-pill {
        position: relative;
        overflow: hidden;
      }
      .nav-pill-active::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 64px;
        height: 32px;
        background-color: var(--m3-secondary-container);
        border-radius: 16px;
        z-index: -1;
      }

      @keyframes ripple {
        from { transform: scale(0); opacity: 0.4; }
        to { transform: scale(4); opacity: 0; }
      }
      .ripple-container { position: relative; overflow: hidden; }
      
      /* Smooth tab transitions */
      .tab-content {
        animation: slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes slide-up {
        from { transform: translateY(30px); opacity: 0; scale: 0.98; }
        to { transform: translateY(0); opacity: 1; scale: 1; }
      }

      /* Desktop view background effect */
      #root {
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top left, #eef2ff 0%, transparent 50%),
                    radial-gradient(circle at bottom right, #fdf4ff 0%, transparent 50%);
      }
    </style>
